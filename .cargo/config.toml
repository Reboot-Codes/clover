[env]
DEFMT_LOG = "debug"

[build]
rustdocflags = [
  "--html-in-header",
  "mermaid-init.html"
]

[target.x86_64-unknown-linux-gnu]
# linker = "clang"
rustflags = [
  # (Nightly) Make the current crate share its generic instantiations
  "-Zshare-generics=y",
  # Make sure that tokio console works
  "--cfg",
  "tokio_unstable"
]

# Common bare-metal ARM flags
[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
  "-C", "panic=abort",
]

# For RP2040 (Raspberry Pi Pico 1)
[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"
# runner = "elf2uf2-rs --deploy --serial --verbose"

# For RP2350 (Raspberry Pi Pico 2)
[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP235x"

[alias]
run-blinkie = "run --target=thumbv8m.main-none-eabihf -p blinkie"

# This and the next is for ESP32
[target.'cfg(target_arch = "riscv32")']
runner    = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "force-frame-pointers",
]

[target.'cfg(target_arch = "xtensa")']
runner    = "espflash flash --monitor"
rustflags = [
  # GNU LD
  "-C", "link-arg=-Wl,-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",

  # LLD
  # "-C", "link-arg=-Tlinkall.x",
  # "-C", "linker=rust-lld",
]
