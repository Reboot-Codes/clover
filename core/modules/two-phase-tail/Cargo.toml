cargo-features = ["per-package-target"]

[package]
name = "two-phase-tail"
version = "0.1.0"
edition = "2024"
default-target = "thumbv8m.main-none-eabihf"

[features]
default = ["pico-2"]

pico-1 = ["embassy-rp/rp2040"]
pico-2 = ["embassy-rp/rp235xa", "embassy-rp/binary-info"]

[dependencies]
carbon_fiber = { workspace = true, features = ["mcu"] }

embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.9.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-futures = { version = "0.1.2" }

defmt = { workspace = true }
defmt-rtt = "1.1"
fixed = "1.29.0"
fixed-macro = "1.2"

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0", features = ["print-defmt"] }
futures = { version = "0.3.31", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }
heapless = "0.9"

embedded-hal-1 = { package = "embedded-hal", version = "=1.0.0" }
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
#embedded-storage = { version = "0.3" }
static_cell = "2"
portable-atomic = { version = "1.13", features = ["critical-section"] }
log = "0.4"
pio-proc = "0.3"
pio = "0.3.0"
rand = { version = "0.9.2", default-features = false }
mcp2515 = "0.3.0"
can-iso-tp = { version = "0.2.0", default-features = false }
embedded-can = "0.4.1"
embedded-can-interface = "0.1.1"
embassy-usb = "0.5.1"
critical-section = "1.2.0"

# Below configs are here to mute the rust-analyzer error.
# "Can't find crate for 'test'" as this is a no_std project
[[bin]]
name = "blinkie"
test = false
bench = false
