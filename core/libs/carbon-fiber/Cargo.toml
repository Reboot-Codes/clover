[package]
name = "carbon_fiber"
version = "0.1.0"
edition = "2024"

[features]
std = [ "serde/std", "rand_chacha/std" ]

mcu = ["defmt"]
alloc = [ "serde/alloc", "sha2/alloc" ]
defmt = [ "dep:defmt" ]

mcu-rp2040 = ["mcu"]
mcu-rp235x = ["mcu"]
mcu-nrf52 = ["mcu"]
mcu-stm32 = ["mcu"]
simulator = ["mcu", "std"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
defmt = { workspace = true, optional = true }
spake2 = "0.4.0"
rand_core = "0.10.1"
sha2 = { version = "0.11.0", default-features = false, features = ["oid"] }
rand_chacha = { version = "0.10.0", default-features = false, features = ["serde"] }
