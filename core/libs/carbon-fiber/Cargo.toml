[package]
name = "carbon_fiber"
version = "0.1.0"
edition = "2024"

[features]
std = [ "serde/std", "rand_chacha/std", "snafu/std", "embassy-sync/std", "embassy-time?/std" ]

embassy-time = ["dep:embassy-time"]
mcu = ["defmt", "embassy-time"]
alloc = [ "serde/alloc", "sha2/alloc", "snafu/alloc" ]
defmt = [ "dep:defmt", "embedded-graphics/defmt", "embassy-sync/defmt", "embassy-time?/defmt" ]

mcu-rp2040 = ["mcu", "dep:rp2040-flash", "dep:cortex-m"]
mcu-rp235x = ["mcu", "dep:rp235x-hal"]
mcu-nrf52 = ["mcu"]
mcu-stm32 = ["mcu"]
simulator = ["mcu", "std"]

[dependencies]
serde = { workspace = true, default-features = false, features = ["derive"] }
defmt = { workspace = true, optional = true }
spake2 = { version = "0.4.0", default-features = false }
rand_core = "0.10.1"
sha2 = { version = "0.11.0", default-features = false, features = ["oid"] }
rand_chacha = { version = "0.10.0", default-features = false }
smart-leds = "0.4.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
snafu = { version = "0.9.2", default-features = false }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", optional = true }
postcard = { version = "1.1.3", default-features = false }
embedded-can = "0.4.1"
embedded-can-interface = "0.1.1"
mcp2515 = "0.3.0"
can-iso-tp = { version = "0.2.0", default-features = false }
rp235x-hal = { version = "0.4.0", optional = true }
rp2040-flash = { version = "0.6.0", optional = true }
cortex-m = { version = "0.7.7", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

